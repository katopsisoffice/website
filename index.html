<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Website</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<style>
:root {
--bg: #0a0f1f;
--panel: #0f172a;
--blue: #38bdf8;
--blue-soft: #1e293b;
--text: #e5e7eb;
--muted: #94a3b8;
}



* {
  box-sizing: border-box;
  font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
}
body {
  margin: 0;
  background: radial-gradient(circle at top, #0b1229, var(--bg));
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  background: linear-gradient(180deg, var(--panel), #020617);
  padding: 48px;
  border-radius: 16px;
  width: 100%;
  max-width: 520px;
  box-shadow: 0 40px 120px rgba(0,0,0,.6);
  border: 1px solid rgba(56,189,248,.15);
}
h1 {
  margin: 0 0 12px;
  font-size: 32px;
  letter-spacing: -0.02em;
}
p {
  margin: 0 0 32px;
  color: var(--muted);
  line-height: 1.6;
}
.btn {
  display: inline-block;
  padding: 14px 22px;
  border-radius: 10px;
  background: linear-gradient(135deg, #38bdf8, #0ea5e9);
  color: #020617;
  font-weight: 600;
  text-decoration: none;
  box-shadow: 0 10px 30px rgba(56,189,248,.35);
  transition: transform .15s ease, box-shadow .15s ease;
}
.btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 16px 40px rgba(56,189,248,.5);
}
footer {
  margin-top: 40px;
  font-size: 12px;
  color: var(--muted);
  opacity: .6;
}
</style>
</head>
<body>
<div class="card">
<h1>Cold Blue Interface</h1>
<p>
Minimal. Calm. High-end.<br>
Built raw. No frameworks. Just control.
</p>
<a class="btn" href="#">Enter</a>
<footer>© 2026</footer>
</div>
</body>
</html>
